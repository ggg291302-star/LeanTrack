# XcodeGen project definition. The build machine turns this into LeanTrack.xcodeproj.
# Never change PRODUCT_BUNDLE_IDENTIFIER: a new bundle ID means a "different app",
# and reinstalling would start with empty data.
name: LeanTrack

options:
  bundleIdPrefix: com.ggg291302
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  LeanTrack:
    type: application
    platform: iOS
    sources:
      - path: LeanTrack
        excludes:
          - "Resources/Data/**"
          - "Resources/RecipePhotos/**"
      # Bundled as folders, so the app finds them at Data/... and RecipePhotos/...
      - path: LeanTrack/Resources/Data
        type: folder
        buildPhase: resources
      - path: LeanTrack/Resources/RecipePhotos
        type: folder
        buildPhase: resources
    info:
      path: Config/LeanTrack-Info.plist
      properties:
        CFBundleDisplayName: LeanTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keep the classic flat iOS look from the design reference on iOS 26
        # instead of the new "Liquid Glass" system bars.
        UIDesignRequiresCompatibility: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggg291302.leantrack
        PRODUCT_NAME: LeanTrack
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  LeanTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeanTrackTests
        excludes:
          - "Fixtures/**"
      - path: LeanTrackTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: LeanTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ggg291302.leantrack.tests

  LeanTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeanTrackUITests
    dependencies:
      - target: LeanTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ggg291302.leantrack.uitests

schemes:
  LeanTrack:
    build:
      targets:
        LeanTrack: all
        LeanTrackTests: [test]
        LeanTrackUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LeanTrackTests
        - LeanTrackUITests
    archive:
      config: Release
